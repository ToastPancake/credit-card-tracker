version: '3.8'

services:
  cc-tracker:
    build: .
    container_name: cc-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # We mount a local 'data' folder to the container's '/app/data'
      # The app will store tracker.db and .actual-data inside this folder
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # IMPORTANT: Do NOT hardcode credentials here if committing to GitHub!
      # Create a .env file on your Oracle VM in the same directory as this docker-compose.yml
      # Docker automatically reads the .env file.
      # - ACTUAL_SERVER_URL=http://actual-server:5006
      # - ACTUAL_PASSWORD=your_password
      # - ACTUAL_SYNC_ID=your_sync_id
      # - ACTUAL_E2E_PASSWORD=your_e2e_password
    networks:
      - actual-network  # Connects this container to the ActualBudget network

# Define the external network that ActualBudget is already running on
networks:
  actual-network:
    external: true
    # This grabs the network name from your .env file!
    # If it's missing, it defaults to 'actual_default'
    name: ${ACTUAL_NETWORK_NAME:-actual_default}
